# Where each AI harness reads its user-level config.
#
# Keys (all optional; omit a key to skip that content type for a harness):
#   skills       directory; each skills/<name>/ is symlinked into it
#   agents       directory; each agents/<name>.md is symlinked into it
#   commands     directory; each commands/<name>.md is symlinked into it
#   instructions file; symlinked to the rendered dist/instructions.md
#   hooks_dir    directory; symlinked to overrides/<harness>/hooks
#   settings     JSON file; hooks from overrides/<harness>/settings.fragment.json are
#                merged in (entries owned by other tools are preserved; backup first)
#
# Paths expand ~ and $ENV_VARS. Override per machine in harnesses.local.toml
# (gitignored) — e.g. `[cursor] enabled = false`.

[claude]
enabled = true
skills = "~/.claude/skills"
agents = "~/.claude/agents"
commands = "~/.claude/commands"
instructions = "~/.claude/CLAUDE.md"
hooks_dir = "~/.claude/hooks/ai-config"
settings = "~/.claude/settings.json"

[codex]
enabled = true
skills = "~/.codex/skills"
commands = "~/.codex/prompts"
instructions = "~/.codex/AGENTS.md"

[opencode]
enabled = true
skills = "~/.config/opencode/skills"
commands = "~/.config/opencode/command"
instructions = "~/.config/opencode/AGENTS.md"
# agents: OpenCode's agent frontmatter differs from Claude's; needs a transform (see docs/roadmap.md)

[gemini]
enabled = true
skills = "~/.gemini/skills"
instructions = "~/.gemini/GEMINI.md"
# commands: Gemini CLI uses TOML commands; needs a transform

[cursor]
enabled = true
skills = "~/.cursor/skills"
# instructions: Cursor's global User Rules live in the Settings UI, not a file
