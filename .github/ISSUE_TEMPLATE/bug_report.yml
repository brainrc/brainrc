name: Bug report
description: Something in brainrc does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For guard bypasses or other vulnerabilities, use the private "Report a vulnerability" link instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or steps. Do not paste secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: brainrc version, harness (Claude Code, Codex, Cursor, ...), OS, Python version.
    validations:
      required: true
