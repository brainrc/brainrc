# The docs site (#197): docs/ built with MkDocs Material, one version per minor release (mike),
# deployed to GitHub Pages by .github/workflows/docs.yml. Build it locally:
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
site_name: brainrc
site_description: One set of AI coding-agent config for Claude Code, Codex CLI, OpenCode, Antigravity CLI and Cursor
site_url: https://brainrc.github.io/brainrc/
repo_url: https://github.com/brainrc/brainrc
repo_name: brainrc/brainrc
edit_uri: edit/main/docs/
docs_dir: docs
not_in_nav: |
  spec-agent.md
strict: true
validation:
  anchors: warn  # a link to a missing heading fails the strict build too
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Getting started: getting-started.md
      - Concepts: concepts.md
  - Packs:
      - Your first pack: tutorial.md
      - Use a pack: packs/use-a-pack.md
      - Import your instructions: packs/import.md
      - Start an employer pack: packs/employer-pack.md
      - Share a team pack: packs/team-pack.md
      - Keep a personal pack: packs/personal-pack.md
      - Publish a stack pack: packs/stack-pack.md
      - Turn a plugin into a pack: packs/from-a-plugin.md
      - Validate a pack in CI: packs/validate-in-ci.md
      - Packs reference: packs.md
      - Why packs: packs/why-packs.md
  - Guides:
      - Team setup: project.md
      - MCP servers: mcp.md
      - Guardrails: guardrails.md
      - Plugins: plugins.md
      - Upgrading: upgrade.md
      - Troubleshooting: troubleshooting.md
  - Gatework:
      - Overview: gatework.md
      - After delivery: post-deliver.md
      - Efficiency: efficiency.md
      - Evals: evals.md
      - End-to-end runs: e2e-runs.md
  - Reference:
      - Commands: commands.md
      - Configuration: configuration.md
      - What reaches each tool: capabilities.md
      - File formats: formats.md
      - JSON Schemas: schemas.md
      - Architecture: architecture.md
  - Project:
      - Roadmap: roadmap.md
      - Harness packages research: harness-packages.md
      - Hook latency: hook-latency.md
