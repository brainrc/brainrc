# Validate a brainrc pack against the core version this action is pinned to (#139):
#
#   - uses: actions/checkout@<sha>
#   - uses: brainrc/brainrc/.github/actions/validate-pack@<core tag or sha>
#     with:
#       path: .            # the pack's directory in your repository
#
# The ref you pin is the core the pack is checked against: GitHub checks out this whole repository at
# that ref to run the action, so there is nothing else to clone. See docs/packs.md (Validate a pack
# in its own CI).
name: Validate a brainrc pack
description: Run `brainrc validate --pack` against a pinned brainrc core, with its default packs.
author: brainrc
branding:
  icon: check-circle
  color: green
inputs:
  path:
    description: The pack's directory, relative to the workspace.
    required: false
    default: "."
  default-packs:
    description: >-
      "true" fetches core's default packs (Gatework) at the versions core pins and checks the pack
      against them, so it may use their skills and agents; "false" checks it against core alone.
    required: false
    default: "true"
  python-version:
    description: The Python to run brainrc with (3.11 or later).
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Fetch core's default packs
      if: ${{ inputs.default-packs == 'true' }}
      shell: bash
      env:
        CORE: ${{ github.action_path }}/../../..
        WORK: ${{ runner.temp }}/brainrc-validate-pack
      # A home of its own: apply fetches the default packs there and finds no harness to write to.
      run: |
        mkdir -p "$WORK/home"
        HOME="$WORK/home" USERPROFILE="$WORK/home" BRAINRC_HOME="$WORK/settings" \
          python "$CORE/scripts/brainrc.py" apply
    - name: Validate the pack
      shell: bash
      env:
        CORE: ${{ github.action_path }}/../../..
        WORK: ${{ runner.temp }}/brainrc-validate-pack
        PACK: ${{ inputs.path }}
      run: |
        mkdir -p "$WORK/home"
        HOME="$WORK/home" USERPROFILE="$WORK/home" BRAINRC_HOME="$WORK/settings" \
          python "$CORE/scripts/brainrc.py" validate --pack "$PACK"
