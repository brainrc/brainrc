name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/aicfg.py validate
      - name: Validate example pack
        run: python3 scripts/aicfg.py validate --pack examples/pack-acme
      - run: python3 -m unittest discover -s tests -v
      - name: Install aicfg as a package and validate its bundled core
        run: |
          python3 -m pip install .
          cd "$RUNNER_TEMP" && aicfg validate
      - run: python3 -m unittest -q
        working-directory: examples/sandbox
      # The gitleaks CLI, not gitleaks-action: the action needs a paid license for org-owned repos.
      - name: Scan new commits for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          range="$BASE..$HEAD"
          case "$BASE" in ""|0000000000000000000000000000000000000000) range="-1 $HEAD" ;; esac
          "$RUNNER_TEMP/gitleaks" detect --redact -v --exit-code=2 --log-opts="--no-merges --first-parent $range"
