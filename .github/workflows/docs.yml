name: docs

# The docs site (#197): docs/ built with MkDocs Material (mkdocs.yml), one version per minor release.
#
# - A pull request that touches the docs builds the site with --strict, so a broken link or
#   anchor fails it. Nothing is published.
# - After each successful `release` run on main, the newest tag of each minor release is built
#   with mike as version <major>.<minor>, when gh-pages doesn't have that tag yet. The newest tag
#   also gets the alias `latest`. A run that was cancelled or failed is caught up by the next one.
#   GitHub Pages serves gh-pages at https://brainrc.github.io/brainrc/.
# - Run it by hand (workflow_dispatch) to publish one tag again; tags before v0.8.18 have no site.
#
# The tools (.github/docs-requirements.txt, pinned with hashes) and the link hook come from this
# workflow's commit, so an older tag builds the same way. The build runs that third-party code
# without a write token; a separate job, which runs no repo or package code, pushes the built
# branch from a fresh repository.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish again (vX.Y.Z); empty for whatever is missing"
        required: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r .github/docs-requirements.txt
      - run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # the tags, and origin/gh-pages for mike
          persist-credentials: false
      - name: Pick the tags to publish
        id: tags
        env:
          WANTED: ${{ inputs.tag }}
        run: |
          releases="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          newest="$(tail -n1 <<<"$releases")"
          newest_of_minor() { awk -v p="v$1." 'index($0, p) == 1' <<<"$releases" | tail -n1; }
          if [ -n "$WANTED" ]; then
            if ! grep -qxF -- "$WANTED" <<<"$releases"; then echo "::error::not a release tag: $WANTED"; exit 1; fi
            if ! git cat-file -e "$WANTED:mkdocs.yml" 2>/dev/null; then
              echo "::error::$WANTED predates the docs site (no mkdocs.yml)"; exit 1
            fi
            minor="${WANTED#v}"; minor="${minor%.*}"
            if [ "$(newest_of_minor "$minor")" != "$WANTED" ]; then
              echo "::error::$WANTED isn't the newest $minor release"; exit 1
            fi
            tags="$WANTED"
          else
            published="$(git show origin/gh-pages:versions.json 2>/dev/null | jq -r '.[].title' || true)"
            tags=""
            for minor in $(sed 's/^v//; s/\.[0-9]*$//' <<<"$releases" | uniq); do
              tag="$(newest_of_minor "$minor")"
              git cat-file -e "$tag:mkdocs.yml" 2>/dev/null || continue
              grep -qxF -- "$minor ($tag)" <<<"$published" || tags="$tags $tag"
            done
          fi
          echo "tags=${tags# }" >> "$GITHUB_OUTPUT"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "publishing: ${tags:- nothing, gh-pages is up to date}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.tags.outputs.tags
        with:
          python-version: "3.12"
      - name: Build each version with mike
        if: steps.tags.outputs.tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          NEWEST: ${{ steps.tags.outputs.newest }}
        run: |
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools"
          cp .github/docs-requirements.txt scripts/mkdocs_hooks.py "$tools/"
          python3 -m pip install --require-hashes -r "$tools/docs-requirements.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $TAGS; do
            version="${tag#v}"; version="${version%.*}"
            git checkout --quiet --force "refs/tags/$tag"
            cp "$tools/mkdocs_hooks.py" scripts/mkdocs_hooks.py
            if [ "$tag" = "$NEWEST" ]; then aliases=(--update-aliases "$version" latest); else aliases=("$version"); fi
            BRAINRC_DOCS_REF="$tag" mike deploy --title "$version ($tag)" --message "Docs for $tag" "${aliases[@]}"
            if [ "$tag" = "$NEWEST" ]; then mike set-default --message "Default docs: latest" latest; fi
          done
          git bundle create "$RUNNER_TEMP/gh-pages.bundle" gh-pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.tags.outputs.tags
        with:
          name: gh-pages
          path: ${{ runner.temp }}/gh-pages.bundle
          if-no-files-found: error

  push:
    needs: site
    if: needs.site.outputs.tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the gh-pages branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-pages
          path: ${{ runner.temp }}/bundle
      - name: Push gh-pages from a fresh repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init --quiet "$RUNNER_TEMP/pages" && cd "$RUNNER_TEMP/pages"
          git fetch --quiet "$RUNNER_TEMP/bundle/gh-pages.bundle" gh-pages:gh-pages
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push "https://github.com/$REPO.git" gh-pages:gh-pages
