# Packs: extra source repos layered on top of this one (see docs/packs.md).
#
# A pack has the same layout as this repo (skills/, agents/, commands/, rules/, overrides/)
# plus a pack.toml. brainrc links its content next to the core's, renders its rules into the
# same instructions file, merges its hook fragments, and renders its spec-agent extensions.
#
# Keys per pack:
#   path     pack repo root; ~ and $ENV_VARS expand, relative paths are relative to this file
#   git      instead of path: a URL brainrc fetches into $BRAINRC_HOME/packs/<key> (apply, update)
#   ref      with git: tag, branch, or commit (default: the remote's default branch)
#   bundled  true for a pack that ships inside core as packs/<name>/ (only in this file)
#   enabled  default true; set false to remove the pack's links and hooks on the next apply
#
# Packs usually differ per machine, so list them in packs.local.toml (gitignored):
#
# [work]
# path = "~/src/work-ai-pack"
#
# Bundled packs ship inside core under packs/<name>/ and are on unless packs.local.toml says
# `enabled = false` (`brainrc init` asks). With none enabled, brainrc installs core's rules and
# guard hooks and nothing else.

[gatework]
bundled = true   # spec-driven work: spec-agent, its roles, ticket connectors and domain skills
