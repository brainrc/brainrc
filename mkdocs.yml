# The docs site (#197): docs/ built with MkDocs Material, one version per minor release (mike),
# deployed to GitHub Pages by .github/workflows/docs.yml. Build it locally:
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
site_name: brainrc
site_description: One set of AI coding-agent config for Claude Code, Codex CLI, OpenCode, Antigravity CLI and Cursor
site_url: https://brainrc.github.io/brainrc/
repo_url: https://github.com/brainrc/brainrc
repo_name: brainrc/brainrc
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
validation:
  anchors: warn  # a link to a missing heading fails the strict build too
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Tutorial: tutorial.md
      - Troubleshooting: troubleshooting.md
  - Guides:
      - Packs: packs.md
      - Project manifest and lockfile: project.md
      - Guardrails: guardrails.md
      - Harness packages: harness-packages.md
      - spec-agent: spec-agent.md
      - After delivery: post-deliver.md
      - Evals: evals.md
      - End-to-end runs: e2e-runs.md
  - Reference:
      - Formats: formats.md
      - Schemas: schemas.md
      - Architecture: architecture.md
      - Efficiency: efficiency.md
      - Roadmap: roadmap.md
