name: release

# On every merge to main: fold changelog.d/ fragments into CHANGELOG.md, bump VERSION, regenerate
# the plugin manifests, commit, and tag v<VERSION>. With no fragments, just tag VERSION if the tag
# is missing. Then create the GitHub Release for v<VERSION> if there isn't one yet. The push uses
# GITHUB_TOKEN, so it doesn't trigger another run. If main is protected, allow GitHub Actions to
# bypass the rule for this workflow (CONTRIBUTING.md § Releases).
#
# Then build the sdist and wheel from the tag, attach them to the GitHub Release, and publish them
# to PyPI by trusted publishing (OIDC): the `pypi` job runs in environment `pypi`, which PyPI's
# trusted publisher for `brainrc` names, and holds no token. Every step is safe to re-run: a
# release, an asset or a PyPI file that already exists is skipped.
#
# Last, the `homebrew` job writes Formula/brainrc.rb for the release and pushes it to the
# brainrc/homebrew-tap repo with the deploy key in secret HOMEBREW_TAP_DEPLOY_KEY. Without the
# secret it skips with a notice, and the release still succeeds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # each job asks for what it needs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release commit, the tag and the GitHub Release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the tip, so a queued run sees the previous run's release commit
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fold fragments
        run: |
          python3 scripts/brainrc.py release
          python3 scripts/brainrc.py validate
      - name: Commit, tag, and push
        run: |
          version="$(cat VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A VERSION CHANGELOG.md changelog.d .claude-plugin .cursor-plugin plugin.json package.json
            git commit -m "Release v${version}"
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already tagged"
            git push origin HEAD:main
          else
            git tag -a "v${version}" -m "v${version}"
            git push --atomic origin HEAD:main "v${version}"
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} already released"
          else
            python3 scripts/brainrc.py release --notes "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "v${version}" --verify-tag --title "v${version}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  dist:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # builds run third-party code (build, hatchling): no write token here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `build` makes the sdist, then the wheel from the sdist, so a file missing from the sdist
      # fails here and not on a user's machine. With build and hatchling pinned, hatchling's
      # reproducible builds make the same bytes when a run is repeated.
      - name: Build the sdist and wheel
        run: |
          python3 -m pip install build==1.6.1 hatchling==1.33.0
          python3 -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          python3 scripts/check_dist.py "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  attach:
    needs: [release, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the files to the GitHub Release
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach them to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in dist/*; do
            if printf '%s\n' "$have" | grep -qxF "$(basename "$f")"; then
              echo "$(basename "$f") already attached"
            else
              gh release upload "v${VERSION}" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done

  pypi:
    needs: [release, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI's trusted publisher for `brainrc` names this workflow and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/brainrc/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write # OIDC for trusted publishing; no PyPI token anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  homebrew:
    needs: [release, dist, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAP: brainrc/homebrew-tap
    steps:
      - name: Check for the tap's deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew tap not updated::Secret HOMEBREW_TAP_DEPLOY_KEY is not set, so Formula/brainrc.rb in ${TAP} stays as it was. Add the tap's deploy key (write access) as that secret, then re-run this workflow."
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The formula downloads the sdist from the URL PyPI lists for it, once PyPI's copy has the
      # sha256 of the file this run built and published. A fresh upload can take a moment to list;
      # another sha256 on PyPI (exit 3) is final, so it isn't retried.
      - name: Write the formula
        if: steps.key.outputs.present == 'true'
        run: |
          for try in 1 2 3 4 5 6; do
            if curl -fsSL -o "$RUNNER_TEMP/pypi.json" "https://pypi.org/pypi/brainrc/${VERSION}/json"; then
              rc=0
              python3 scripts/homebrew_formula.py "dist/brainrc-${VERSION}.tar.gz" \
                --pypi-json "$RUNNER_TEMP/pypi.json" --out "$RUNNER_TEMP/brainrc.rb" || rc=$?
              [ "$rc" -eq 0 ] && exit 0
              [ "$rc" -eq 3 ] && exit 1
            fi
            sleep 10
          done
          exit 1
      # Install and test the formula with Homebrew before the tap gets it, from a scratch tap
      # (Homebrew installs formulae only from taps). ubuntu-latest ships Homebrew, off PATH.
      - name: Install and test the formula
        if: steps.key.outputs.present == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git brainrc-release/check
          cp "$RUNNER_TEMP/brainrc.rb" "$(brew --repository brainrc-release/check)/Formula/brainrc.rb"
          brew install --formula brainrc-release/check/brainrc
          brew test brainrc-release/check/brainrc
      - name: Push it to the tap
        if: steps.key.outputs.present == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -f "$ssh_dir/key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # github.com's host keys from GitHub's own API, over TLS, rather than trust on first use.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git clone --depth 1 "git@github.com:${TAP}.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/brainrc.rb" Formula/brainrc.rb
          if git diff --quiet -- Formula/brainrc.rb && git ls-files --error-unmatch Formula/brainrc.rb >/dev/null 2>&1; then
            echo "Formula/brainrc.rb in ${TAP} is already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/brainrc.rb
          git commit -m "brainrc ${VERSION}"
          git push origin HEAD
