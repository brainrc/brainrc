# Packs: extra source repos layered on top of this one (see docs/packs.md).
#
# A pack has the same layout as this repo (skills/, agents/, commands/, rules/, overrides/)
# plus a pack.toml. aicfg links its content next to the core's, renders its rules into the
# same instructions file, merges its hook fragments, and renders its spec-agent extensions.
#
# Keys per pack:
#   path     pack repo root; ~ and $ENV_VARS expand, relative paths are relative to this repo
#   enabled  default true; set false to remove the pack's links and hooks on the next apply
#
# Packs usually differ per machine, so list them in packs.local.toml (gitignored):
#
# [work]
# path = "~/src/work-ai-pack"
