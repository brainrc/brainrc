# Ticket 024 (oneshot, Callout defaults): run `/work local:tickets/024-oneshot-callouts.md --auto --oneshot`.
# Oneshot alone gives a ready PR (`pr_draft` false) with the Callouts listed; plain `--auto` would stop.
# The new dependency and the destructive step take their safer defaults and the PR is ready.
ticket_ref = "local:tickets/024-oneshot-callouts.md"

[[check]]
kind = "state"
field = "oneshot"
equals = true

[[check]]
kind = "state"
field = "auto"
equals = true

[[check]]
kind = "state"
field = "blocked"
present = false

[[check]]
kind = "state"
field = "ticket.pr"
present = true

[[check]]
kind = "state"
field = "ticket.pr_draft"
equals = false

[[check]]
kind = "no_files"
glob = "requirements.txt"

[[check]]
kind = "file"
path = "greet.py"
absent = "(?m)^\\s*(import|from)\\s+colorama"

[[check]]
kind = "file"
path = "test_greet.py"
matches = "(?m)^class |^def test"

[[check]]
kind = "file"
path = "{spec}/pr-body.md"
matches = "(?s)## Decisions made without you.*colorama"

[[check]]
kind = "file"
path = "{spec}/pr-body.md"
matches = "(?is)## Decisions made without you.*(destructive|delete|test_greet)"

[[check]]
kind = "main_untouched"

[[check]]
kind = "command"
run = ["python3", "-m", "unittest", "-q"]
exit = 0
