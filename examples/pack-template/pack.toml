#:schema https://raw.githubusercontent.com/brainrc/brainrc/main/docs/schemas/pack.toml.schema.json
name = "mypack"
prefix = "mypack-"  # every skill, agent, command and MCP server starts with this
description = "Rules and facts for mypack's AI coding agents."
requires_core = ">=0.8, <0.9"  # the brainrc versions this pack works with
max_always_tokens = 800  # budget for what loads in every session: rules and descriptions
test = "tests"  # tests that `brainrc validate --pack` runs
