# Ticket 029 (oneshot campaign): run `/work --campaign local:tickets/029-oneshot-epic.md --shape ordered --oneshot`
# to the end. No gate stop: children run in dependency order (005, 006, 007), delivered stacked,
# every PR ready (branches recorded as PRs, no remote).
ticket_ref = "local:tickets/029-oneshot-epic.md"

[[check]]
kind = "state"
field = "oneshot"
equals = true

[[check]]
kind = "state"
field = "delivery"
equals = "stacked"

[[check]]
kind = "campaign"
delivery = "stacked"
ready = true
strict_stack = true
order = [
  "local:tickets/005-greeting-param.md",
  "local:tickets/006-greeting-flag.md",
  "local:tickets/007-shout-custom-greeting.md",
]

[[check]]
kind = "main_untouched"

[[check]]
kind = "command"
run = ["python3", "-m", "unittest", "-q"]
exit = 0
