# pre-commit hooks for a brainrc pack's own repository (#139). In the pack's .pre-commit-config.yaml:
#
#   - repo: https://github.com/brainrc/brainrc
#     rev: <core tag>          # the core the pack is checked against
#     hooks:
#       - id: brainrc-validate-pack
#         # args: [pack]       # the pack's directory, when it isn't the repository root
#
# It checks the pack against that core and the default packs (Gatework) at the versions that core
# pins, fetched once into a cache of their own. See docs/packs/validate-in-ci.md.
- id: brainrc-validate-pack
  name: brainrc validate --pack
  description: Check this pack against the pinned brainrc core (frontmatter, pack.toml, references, tripwires, its tests).
  entry: brainrc validate --fetch-defaults --pack
  args: ["."]
  language: python
  pass_filenames: false
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
