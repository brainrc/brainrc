# Where each AI harness reads its user-level config.
#
# brainrc manages a harness only when it is installed: when its `home` directory exists (default:
# the directory holding its `instructions` or `skills` path, e.g. ~/.claude). Others are skipped
# and named in the output; `enabled = true` in harnesses.local.toml manages one anyway.
#
# Keys (all optional; omit a key to skip that content type for a harness):
#   home         directory whose existence means the harness is installed (see above)
#   skills       directory; each skills/<name>/ is symlinked into it
#   agents       directory; each agents/<name>.md is symlinked into it
#   agents_format "claude" (default) links agents as written; "opencode" links copies rendered
#                to $BRAINRC_HOME/opencode/agents in OpenCode's format
#   commands     directory; each commands/<name>.md is symlinked into it
#   plugin       file; symlinked to overrides/<harness>/plugin.js (OpenCode's guard plugin)
#   instructions file; symlinked to the rendered $BRAINRC_HOME/instructions.md (default ~/.config/brainrc)
#   hooks_dir    directory; symlinked to overrides/<harness>/hooks. Fragments refer to it
#                as {{hooks_dir}}, so moving it keeps hook commands working
#   settings     JSON file; hooks from overrides/<harness>/settings.fragment.json are
#                merged in (entries owned by other tools are preserved; backup first)
#   settings_format "claude" (default; Cursor's and Codex's files too) keeps hooks under "hooks";
#                "antigravity" keeps them under a named entry, `brainrc`, as Antigravity's hooks.json does;
#                "kiro" keeps a list of hook entries, as Kiro's hook files do
#                "copilot" keeps them under "hooks", with brainrc's script as `bash`, as Copilot's do
#   mcp          the harness's MCP config file; servers from mcp/servers.toml are merged in
#                (each tool with an adapter that writes MCP; your own servers are never overwritten)
#
# Project scope (a repo's brainrc.toml, docs/project.md) writes the standard .agents/skills/ and
# AGENTS.md, which Codex, OpenCode, Cursor and Antigravity read. These two keys, paths in the repo,
# are for a tool that can't read them:
#   project_skills       directory; each skill is copied here too
#   project_instructions file; gets a marked block that imports AGENTS.md (`@AGENTS.md`)
#
# Paths expand ~ and $ENV_VARS. `${VAR:-default}` reads VAR when it holds an absolute path and
# uses default when VAR is unset, empty or relative: that is how each harness's own variable
# (CLAUDE_CONFIG_DIR, CODEX_HOME, XDG_CONFIG_HOME, COPILOT_HOME, KIRO_HOME) moves its paths. Override per machine in
# harnesses.local.toml (gitignored) — e.g. `[cursor] enabled = false`.

[claude]
enabled = true
skills = "${CLAUDE_CONFIG_DIR:-~/.claude}/skills"
agents = "${CLAUDE_CONFIG_DIR:-~/.claude}/agents"
commands = "${CLAUDE_CONFIG_DIR:-~/.claude}/commands"
instructions = "${CLAUDE_CONFIG_DIR:-~/.claude}/CLAUDE.md"
hooks_dir = "${CLAUDE_CONFIG_DIR:-~/.claude}/hooks/brainrc"
settings = "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
mcp = "${CLAUDE_CONFIG_DIR:-~}/.claude.json"  # Claude Code keeps it inside CLAUDE_CONFIG_DIR when set
project_skills = ".claude/skills"  # Claude Code reads neither .agents/skills nor AGENTS.md beside a CLAUDE.md
project_instructions = "CLAUDE.md"

[codex]
enabled = true
skills = "${CODEX_HOME:-~/.codex}/skills"
commands = "${CODEX_HOME:-~/.codex}/prompts"
instructions = "${CODEX_HOME:-~/.codex}/AGENTS.md"
hooks_dir = "${CODEX_HOME:-~/.codex}/hooks/brainrc"
settings = "${CODEX_HOME:-~/.codex}/hooks.json"  # Codex asks you to trust new hooks once, in /hooks
mcp = "${CODEX_HOME:-~/.codex}/config.toml"

[opencode]
enabled = true
skills = "${XDG_CONFIG_HOME:-~/.config}/opencode/skills"
commands = "${XDG_CONFIG_HOME:-~/.config}/opencode/command"
agents = "${XDG_CONFIG_HOME:-~/.config}/opencode/agents"
agents_format = "opencode"
plugin = "${XDG_CONFIG_HOME:-~/.config}/opencode/plugins/brainrc-guard.js"
instructions = "${XDG_CONFIG_HOME:-~/.config}/opencode/AGENTS.md"
mcp = "${XDG_CONFIG_HOME:-~/.config}/opencode/opencode.json"  # opencode.jsonc instead when only it exists

[antigravity]
enabled = true
skills = "~/.gemini/config/skills"
instructions = "~/.gemini/config/AGENTS.md"
hooks_dir = "~/.gemini/config/hooks/brainrc"
settings = "~/.gemini/config/hooks.json"
settings_format = "antigravity"
# agents: Antigravity's agent frontmatter is unverified

# Gemini CLI ended for individual accounts on June 18, 2026 (Antigravity CLI replaced it) and goes on
# for Gemini Code Assist Standard and Enterprise and paid API keys. Off by default, since ~/.gemini
# is Antigravity's too; `enabled = true` in harnesses.local.toml if your account runs it.
# https://geminicli.com/docs/cli/skills/ , /docs/hooks/reference/ , /docs/tools/mcp-server/
[gemini]
enabled = false
skills = "~/.gemini/skills"
instructions = "~/.gemini/GEMINI.md"
hooks_dir = "~/.gemini/hooks/brainrc"
settings = "~/.gemini/settings.json"
mcp = "~/.gemini/settings.json"  # the same file: hooks and mcpServers sit side by side
# agents: its subagents (~/.gemini/agents) take Gemini's own tool names in `tools`
# commands: its custom commands (~/.gemini/commands) are TOML, not Markdown

[cursor]
enabled = true
skills = "~/.cursor/skills"
hooks_dir = "~/.cursor/hooks/brainrc"
settings = "~/.cursor/hooks.json"
# instructions: Cursor's global User Rules live in the Settings UI, not a file

# The Copilot CLI and VS Code's Copilot agent share ~/.copilot.
# https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference
# https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-hooks-reference
[copilot]
enabled = true
home = "${COPILOT_HOME:-~/.copilot}"
skills = "${COPILOT_HOME:-~/.copilot}/skills"
instructions = "${COPILOT_HOME:-~/.copilot}/copilot-instructions.md"
hooks_dir = "${COPILOT_HOME:-~/.copilot}/hooks/brainrc"
settings = "${COPILOT_HOME:-~/.copilot}/hooks/brainrc.json"  # brainrc's own hook file in the hooks folder
mcp = "${COPILOT_HOME:-~/.copilot}/mcp-config.json"
# agents: Copilot's agents are *.agent.md files with a `tools` list in its own names
# commands: no user-level command folder is documented

# Devin Local, in Devin Desktop (formerly Windsurf): Windsurf's docs now lead to Devin's.
# https://docs.devin.ai/desktop/devin-local/customizations , /cli/extensibility/rules ,
# /cli/extensibility/mcp/configuration , /cli/extensibility/hooks/overview
[devin]
enabled = true
home = "~/.config/devin"
skills = "~/.config/devin/skills"
instructions = "~/.config/devin/AGENTS.md"
hooks_dir = "~/.config/devin/hooks/brainrc"
settings = "~/.config/devin/config.json"  # hooks under "hooks", in Claude Code's shape
mcp = "~/.config/devin/mcp_config.json"  # ${env:VAR} in `env` is unverified (documented for OAuth fields)
# agents, commands: Devin Local documents no user-level folders (Cascade's workflows are retired)

# https://kiro.dev/docs/configuration/ , /docs/skills/ , /docs/steering/ , /docs/hooks/ ,
# /docs/mcp/configuration/
[kiro]
enabled = true
home = "${KIRO_HOME:-~/.kiro}"
skills = "${KIRO_HOME:-~/.kiro}/skills"
instructions = "${KIRO_HOME:-~/.kiro}/steering/AGENTS.md"  # an AGENTS.md in global steering is always included
hooks_dir = "${KIRO_HOME:-~/.kiro}/hooks/brainrc"
settings = "${KIRO_HOME:-~/.kiro}/hooks/brainrc.json"  # Kiro CLI loads ~/.kiro/hooks as global hooks
settings_format = "kiro"
mcp = "${KIRO_HOME:-~/.kiro}/settings/mcp.json"  # ${VAR} expands only for its approved variables
# agents: Kiro's agents take tool selectors (read, shell, @mcp) in `tools`, not Claude Code's names

# https://ampcode.com/docs/customize/skills , /docs/customize/agents-md , /docs/customize/mcp
[amp]
enabled = true
home = "~/.config/amp"
skills = "~/.config/amp/skills"
instructions = "~/.config/amp/AGENTS.md"
mcp = "~/.config/amp/settings.json"  # under "amp.mcpServers"; settings.jsonc instead when only it exists
# hooks: Amp's only hook point is its TypeScript plugin API, which brainrc doesn't write yet
# agents, commands: no user-level folders are documented

# https://junie.jetbrains.com/docs/agent-skills.html , /docs/guidelines-and-memory.html ,
# /docs/junie-cli-subagents.html , /docs/junie-cli-mcp-configuration.html , /docs/junie-cli-hooks.html
[junie]
enabled = true
home = "~/.junie"
skills = "~/.junie/skills"
agents = "~/.junie/agents"  # Claude Code's frontmatter: name, description, tools (Read, Bash, ...), model
instructions = "~/.junie/AGENTS.md"
hooks_dir = "~/.junie/hooks/brainrc"
settings = "~/.junie/config.json"  # hooks under "hooks"; a project's own config.json hooks are ignored
mcp = "~/.junie/mcp/mcp.json"  # no variable references: env_from variables come from Junie's environment
# commands: Junie's commands take $name arguments, not $ARGUMENTS
