#:schema https://raw.githubusercontent.com/brainrc/brainrc/main/docs/schemas/pack.toml.schema.json
# Example pack: copy this directory to start your own (see README.md).
name = "acme"
prefix = "acme-"                  # skills, agents, and commands must start with this
id = "acme/acme-ai-pack"          # optional: <owner>/<pack>; the prefix starts with the owner (docs/packs.md#naming)
requires_core = ">=0.6, <0.9"     # core versions this pack works with (docs/packs.md#compatibility)
max_always_tokens = 400          # rules + descriptions loaded every session (docs/packs.md#context-cost)

# Where the pack applies: its deliver checks, guard rules and reviewers stay out of other work.
# Any glob matching is enough; without [scope] a pack applies everywhere (docs/packs.md#scope).
[scope]
remotes = ["github.com/acme/*", "git.acme.example.net/*"]
tickets = ["ACME-*"]

# Guard rules core's guard hook enforces under the pack's [scope], inside `bash -c` and `$(...)` too
# (docs/packs.md#guard-rules). A deny refuses; an ask prompts first.
[[guard.deny]]
match = "acme-deploy prod"
reason = "acme-deploy prod deploys to production, which only the release pipeline does"

[[guard.ask]]
tool = "mcp__acme-jira__*transition*"
reason = "moves an Acme ticket to another status"

# Extensions for Gatework, the default pack, under its own table (docs/packs.md#extensions).
[extensions.gatework]
# Listed at the Deliver gate as done / not applicable / not run.
deliver_checks = [
  "Deploy plan reviewed by the owning team",
]

# Extra row for Gatework's Domains table: files that load acme-deploy and get infra review.
[[extensions.gatework.domains]]
files = "`deploy/*.yaml`, `charts/acme-*`"
skills = ["acme-deploy"]
reviewer = "brainrc-infra-reviewer"

# Skills Gatework runs right after fetching a ticket.
[[extensions.gatework.intake_context]]
skill = "acme-context"
when = "every ticket"

# Ticket connector for ACME-* refs, with its config (keys: the brainrc-ticket-jira skill, § Config).
[extensions.gatework.ticket]
connector = "brainrc-ticket-jira"
refs = ["ACME-*"]
host = "acme.example.net"
review_status = "In Review"
blocked_status = "Blocked"
# What the connector should know about this team's tickets: a defined field that tripwires check.
instructions = "Link the PR in the ticket's Development panel, not in a comment."
