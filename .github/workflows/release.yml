name: release

# On every merge to main: fold changelog.d/ fragments into CHANGELOG.md, bump VERSION, regenerate
# the plugin manifests, commit, and tag v<VERSION>. With no fragments, just tag VERSION if the tag
# is missing. The push uses GITHUB_TOKEN, so it doesn't trigger another run. If main is protected,
# allow GitHub Actions to bypass the rule for this workflow (CONTRIBUTING.md § Releases).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main # the tip, so a queued run sees the previous run's release commit
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fold fragments
        run: |
          python3 scripts/aicfg.py release
          python3 scripts/aicfg.py validate
      - name: Commit, tag, and push
        run: |
          version="$(cat VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A VERSION CHANGELOG.md changelog.d .claude-plugin .cursor-plugin plugin.json
            git commit -m "Release v${version}"
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already tagged"
            git push origin HEAD:main
          else
            git tag -a "v${version}" -m "v${version}"
            git push --atomic origin HEAD:main "v${version}"
          fi
